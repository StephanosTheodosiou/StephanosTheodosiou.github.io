<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#7c5cfc" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo badge -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="16" fill="none" stroke="#7c5cfc" stroke-width="2" opacity="0.5"/>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#7c5cfc">ST</text>
  </g>

  <!-- Status badge -->
  <g transform="translate(80, 200)">
    <rect width="280" height="38" rx="19" fill="#7c5cfc" fill-opacity="0.12" stroke="#7c5cfc" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="22" cy="19" r="4" fill="#7c5cfc"/>
    <text x="42" y="24" font-family="monospace" font-size="12" fill="#a98cff" letter-spacing="1.5">WELCOME TO MY PORTFOLIO!</text>
  </g>

  <!-- Name -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="84" font-weight="900" fill="#ffffff" letter-spacing="-2">Stephanos</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="84" font-weight="900" fill="#7c5cfc" letter-spacing="-2">Theodosiou</text>

  <!-- Tagline -->
  <text x="80" y="490" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.5)" letter-spacing="2">SOFTWARE DEVELOPER · CS STUDENT @ UCY</text>

  <!-- Bottom info -->
  <text x="80" y="560" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.3)" letter-spacing="2">STEPHANOSTHEODOSIOU.GITHUB.IO</text>

  <!-- Decorative element right side -->
  <g transform="translate(900, 315)" opacity="0.4">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#7c5cfc" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a98cff" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="#7c5cfc" opacity="0.2"/>
    <circle cx="0" cy="0" r="20" fill="#7c5cfc" opacity="0.6"/>
  </g>

  <!-- Tech tags -->
  <g transform="translate(80, 590)" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">
    <text x="0" y="0">ANGULAR</text>
    <text x="90" y="0">·</text>
    <text x="110" y="0">TYPESCRIPT</text>
    <text x="220" y="0">·</text>
    <text x="240" y="0">.NET</text>
    <text x="290" y="0">·</text>
    <text x="310" y="0">PYTHON</text>
    <text x="390" y="0">·</text>
    <text x="410" y="0">FULL-STACK</text>
  </g>
</svg>